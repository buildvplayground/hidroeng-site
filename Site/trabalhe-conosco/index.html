<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trabalhe Conosco — Hidroeng</title>
<meta name="description" content="Envie seu currículo e faça parte do time da Hidroeng Projetos e Consultoria.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../assets/logos/logo-azul.svg">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --c-primary:#0060B0; --c-primary-dark:#0056A0; --c-dark:#0A1826; --c-white:#FFF;
  --c-bg:#F5F8FA; --c-n200:#EDF2F6; --c-n400:#8DA0B3; --c-n500:#5C6D7F;
  --font:'Inter',system-ui,sans-serif; --font-display:'Archivo',system-ui,sans-serif;
  --cw:560px; --px:clamp(1.25rem,4vw,2rem); --r-sm:.625rem; --r-md:1.25rem; --r-pill:100px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--c-bg);color:var(--c-dark);min-height:100vh;display:flex;flex-direction:column}
:focus-visible{outline:3px solid #3D96E4;outline-offset:2px}
.page-nav{background:var(--c-dark);padding:1rem var(--px);display:flex;align-items:center;justify-content:center}
.page-nav a{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:var(--font-display);font-weight:700;letter-spacing:.12em}
.page-nav img{height:40px;width:auto}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:clamp(2.5rem,6vw,5rem) var(--px)}
.page-header{text-align:center;max-width:480px;margin-bottom:2.5rem}
.page-header .overline{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c-primary);border:1px solid rgba(0,96,176,.3);border-radius:var(--r-pill);padding:5px 14px;margin-bottom:1rem}
.page-header h1{font-family:var(--font-display);font-size:clamp(1.5rem,3vw + .5rem,2rem);font-weight:800;line-height:1.2;margin-bottom:.75rem}
.page-header p{font-size:.95rem;color:var(--c-n500);line-height:1.65}
.form-card{background:var(--c-white);border-radius:var(--r-md);border:1px solid var(--c-n200);padding:clamp(1.75rem,4vw,2.5rem);width:100%;max-width:var(--cw)}
.form-grid{display:flex;flex-direction:column;gap:1.1rem}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--c-n500)}
.form-group input,.form-group select,.form-group textarea{padding:12px 14px;border:1px solid var(--c-n200);border-radius:var(--r-sm);font-family:var(--font);font-size:.9375rem;color:var(--c-dark);background:var(--c-white);transition:border-color .2s;width:100%}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(0,96,176,.15)}
.file-label{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px dashed #C6D2DC;border-radius:var(--r-sm);background:var(--c-bg);cursor:pointer;font-size:.875rem;color:var(--c-n500);transition:border-color .2s}
.file-label:hover{border-color:var(--c-primary)}
input[type="file"]{display:none}
.file-name{font-size:.8125rem;color:var(--c-n400)}
.form-submit{width:100%;padding:14px;background:linear-gradient(120deg,#0060B0,#1478D2);color:#fff;border:none;border-radius:var(--r-pill);font-family:var(--font-display);font-size:.9375rem;font-weight:700;cursor:pointer;transition:filter .2s,transform .15s;margin-top:.5rem}
.form-submit:hover{filter:brightness(1.08);transform:translateY(-1px)}
.form-submit:disabled{opacity:.5;cursor:not-allowed;transform:none}
.form-feedback{padding:12px 16px;border-radius:var(--r-sm);font-size:.875rem;display:none}
.form-feedback.success{background:#f0faf4;border:1px solid #a3d9b1;color:#1a6b35}
.form-feedback.error{background:#fdf2f2;border:1px solid #e8b4b4;color:#8a2020}
.page-footer{text-align:center;padding:2rem var(--px);font-size:.8rem;color:var(--c-n400);border-top:1px solid var(--c-n200)}
.page-footer a{color:var(--c-primary);text-decoration:none}
@media (max-width:600px){.form-card{padding:1.5rem 1.25rem}}
</style>
</head>
<body>
<!-- BuildV: GTM (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KDT36FWB"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- /BuildV: GTM (noscript) -->
<nav class="page-nav">
  <a href="../" aria-label="Hidroeng — Home">
    <img src="../assets/logos/logo-branco.svg" alt="Hidroeng" width="34" height="40"><span>HIDROENG</span>
  </a>
</nav>
<main>
  <header class="page-header">
    <span class="overline">Carreiras</span>
    <h1>Faça parte do time Hidroeng</h1>
    <p>Valorizamos profissionais comprometidos com a qualidade técnica. Envie seu currículo e entraremos em contato.</p>
  </header>
  <div class="form-card">
    <form id="formTrabalhe" class="form-grid" enctype="multipart/form-data">
      <input type="hidden" name="form_type" value="candidato">
      <div class="form-group">
        <label for="t-area">Área de interesse</label>
        <select id="t-area" name="area" required>
          <option value="" disabled selected>Selecione…</option>
          <option>Projetos de abastecimento de água</option>
          <option>Projetos de esgotamento sanitário</option>
          <option>Estudos técnicos / hidrologia</option>
          <option>Administrativo / Comercial</option>
          <option>Outro</option>
        </select>
      </div>
      <div class="form-group">
        <label for="f-nome">Nome completo</label>
        <input type="text" id="f-nome" name="nome" placeholder="Seu nome completo" required>
      </div>
      <div class="form-group">
        <label for="f-email">E-mail</label>
        <input type="email" id="f-email" name="email" placeholder="contato@empresa.com" required>
      </div>
      <div class="form-group">
        <label for="f-tel">Telefone / WhatsApp</label>
        <input type="tel" id="f-tel" name="telefone" placeholder="(62) 90000-0000" required>
      </div>
      <div class="form-group">
        <label for="t-arquivo">Currículo (opcional)</label>
        <label class="file-label" for="t-arquivo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 2h9l5 5v15H6zM14 2v6h6"/></svg>
          Anexar arquivo
          <span class="file-name" id="t-file-name">PDF, DOC ou DOCX · máx. 5 MB</span>
        </label>
        <input type="file" id="t-arquivo" name="arquivo" accept=".pdf,.doc,.docx">
      </div>
      <div class="form-feedback" id="t-feedback" role="status"></div>
      <button type="submit" class="form-submit" id="t-submit">Enviar candidatura</button>
    </form>
  </div>
</main>
<footer class="page-footer">
  <p>Hidroeng Projetos e Consultoria &copy; 2026 &nbsp;·&nbsp; <a href="../">Voltar ao site</a></p>
</footer>
<script>
(function () {
  var arq = document.getElementById('t-arquivo');
  if (arq) arq.addEventListener('change', function () {
    document.getElementById('t-file-name').textContent = this.files[0] ? this.files[0].name : 'PDF, DOC ou DOCX · máx. 5 MB';
  });
  var form = document.getElementById('formTrabalhe');
  var btn = document.getElementById('t-submit');
  var feedback = document.getElementById('t-feedback');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var orig = btn.textContent;
    btn.disabled = true; btn.textContent = 'Enviando…'; feedback.style.display = 'none';
    fetch('../form-handler.php', { method: 'POST', body: new FormData(form) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.success) {
          feedback.className = 'form-feedback success';
          feedback.textContent = 'Candidatura enviada! Entraremos em contato em breve.';
          feedback.style.display = 'block';
          form.reset();
          document.getElementById('t-file-name').textContent = 'PDF, DOC ou DOCX · máx. 5 MB';
        } else { throw new Error(d.message || 'Erro ao enviar.'); }
      })
      .catch(function (err) { feedback.className = 'form-feedback error'; feedback.textContent = err.message; feedback.style.display = 'block'; })
      .finally(function () { btn.disabled = false; btn.textContent = orig; });
  });
}());
</script>
</body>
</html>
